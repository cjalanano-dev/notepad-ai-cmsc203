name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js (for Tailwind CSS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish Blazor WebAssembly App
        run: dotnet publish BlazorApp1.csproj -c Release -o output

      - name: Rewrite base href and add SPA 404 redirect
        run: |
          # 1. Update <base href="/" /> in index.html to match the repository name
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d '/' -f 2)
          sed -i "s|<base href=\"/\" />|<base href=\"/$REPO_NAME/\" />|g" output/wwwroot/index.html
          
          # 2. Duplicate index.html to 404.html for SPA page-refresh support
          cp output/wwwroot/index.html output/wwwroot/404.html
          
          # 3. Add .nojekyll so GitHub Pages does not ignore the _framework directory
          touch output/wwwroot/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
