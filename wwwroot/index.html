<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Notepad AI</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/webp" href="assets/logo/conext-logo-256.webp" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body class="bg-canvas text-ink antialiased overflow-hidden select-none">
    <div id="app">
        <div style="height: 100vh; width: 100vw; background: #0e0e11; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #9c9ca8; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
            <div style="width: 28px; height: 28px; border: 2px solid #22222a; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px;"></div>
            <div style="font-size: 13px; font-weight: 500; letter-spacing: 0.02em; color: #f4f4f6;">Loading Notepad AI</div>
            <div style="font-size: 11px; color: #626270; margin-top: 4px;">Local In-Browser Workspace</div>
            <style>
                @keyframes spin { to { transform: rotate(360deg); } }
            </style>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet style="display:none; position:fixed; bottom:0; left:0; right:0; background:#ef4444; color:white; padding:10px 16px; font-size:12px; z-index:9999;">
        An unhandled error has occurred.
        <a href="." style="color:white; text-decoration:underline; font-weight:bold; margin-left:8px;">Reload</a>
    </div>

    <script src="lib/sql-wasm.js"></script>
    <script src="lib/pdf.min.js"></script>
    <script src="sqlite-storage.js"></script>
    <script src="concept-map.js"></script>
    <script src="keyboard-shortcuts.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
